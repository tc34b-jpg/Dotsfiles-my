# ─────────────────────────────────────────
#   KITTY CONFIG — tema: gray minim.
# ─────────────────────────────────────────

# ── Fonte ──
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Cursor ──
cursor                  #00f0ff
cursor_text_color       #0a0c12
cursor_shape            block
cursor_blink_interval   0.5
cursor_stop_blinking_after 0

# ── Janela ──
background_opacity       0.85
dynamic_background_color no
window_padding_width     12
confirm_os_window_close  0

# ── Cores base ──
foreground           #c8d3f5
background           #0a0c12
selection_foreground #0a0c12
selection_background #00f0ff

# ── Borda ──
active_border_color   #00f0ff
inactive_border_color #1f293d

# ── Paleta 16 cores ──
# Preto
color0  #0a0c12
color8  #1f293d

# Vermelho
color1  #ff4a4a
color9  #ff6b6b

# Verde
color2  #00b4d8
color10 #48cae4

# Amarelo
color3  #3b82f6
color11 #60a5fa

# Azul
color4  #00f0ff
color12 #90e0ef

# Magenta
color5  #3b82f6
color13 #60a5fa

# Ciano
color6  #00f0ff
color14 #ade8f4

# Branco
color7  #c8d3f5
color15 #ffffff

# ── URL ──
url_color #00f0ff
url_style curly

# ── Tabs ──
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_background          #0a0c12
active_tab_foreground       #0a0c12
active_tab_background       #00f0ff
active_tab_font_style       bold
inactive_tab_foreground     #00b4d8
inactive_tab_background     #161b26
inactive_tab_font_style     normal

# ── Bell ──
enable_audio_bell no
