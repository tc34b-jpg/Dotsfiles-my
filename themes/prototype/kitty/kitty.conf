# ─────────────────────────────────────────
#   KITTY CONFIG — tema: prototype
# ─────────────────────────────────────────

# ── Fonte ──
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Cursor ──
cursor                  #cc0000
cursor_text_color       #0a0a0a
cursor_shape            block
cursor_blink_interval   0.5
cursor_stop_blinking_after 0

# ── Janela ──
background_opacity       0.90
dynamic_background_color no
window_padding_width     12
confirm_os_window_close  0

# ── Cores base ──
foreground           #d4d4d4
background           #0a0a0a
selection_foreground #0a0a0a
selection_background #cc0000

# ── Borda ──
active_border_color   #cc0000
inactive_border_color #1a1010

# ── Paleta 16 cores ──
# Preto
color0  #0a0a0a
color8  #3a3a3a

# Vermelho
color1  #cc0000
color9  #ff2222

# Verde
color2  #4a4a4a
color10 #6a6a6a

# Amarelo
color3  #8b0000
color11 #aa0000

# Azul
color4  #2a2a2a
color12 #4a4a4a

# Magenta
color5  #8b0000
color13 #cc0000

# Ciano
color6  #5a5a5a
color14 #888888

# Branco
color7  #d4d4d4
color15 #ffffff

# ── URL ──
url_color #cc0000
url_style curly

# ── Tabs ──
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_background          #0a0a0a
active_tab_foreground       #0a0a0a
active_tab_background       #cc0000
active_tab_font_style       bold
inactive_tab_foreground     #8b0000
inactive_tab_background     #111111
inactive_tab_font_style     normal

# ── Bell ──
enable_audio_bell no
